name: Health Check

on:
    workflow_dispatch:
    schedule:
        - cron: '59 23 1 12 *'    
jobs:
    health_check:
        runs-on: ubuntu-latest
        steps:
            - name: Check the deployed service
              uses: jtalk/url-health-check-action@v5
              with:
                url: ${{ secrets.DEPLOY_URL}}
                max-attempts: 3
                retry-delay: 120s